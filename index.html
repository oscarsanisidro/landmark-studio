<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --line: #ddd8cf; --ink: #22252a; --muted: #6b6f76;
  --accent: #d9822b; --accent-ink: #fff; --ok: #2e8b57; --warn: #c0392b; --info: #2f6db5;
  --stage: #17191c; --scale: #e8559b;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; font-size: 13px; }

#app { display: grid; height: 100vh; grid-template-rows: auto 1fr; grid-template-columns: 300px 1fr; }

(también en subcarpetas)."}, "miss.example": {"en": "Example of a path searched: ", "zh": "查找的路径示例：", "es": "Ejemplo de ruta buscada: "}, "welcome.p1": {"en": "Click <b>New</b> and choose the folder with your photos to create a project, or <b>Open</b> to continue a Landmark Studio project (.lmproj). To bring in a TPS file, use <b>File ▸ Import TPS</b>.", "zh": "点击<b>新建</b>并选择照片所在的文件夹来创建项目，或点击<b>打开</b>继续 Landmark Studio 项目（.lmproj）。要导入 TPS 文件，请使用<b>文件 ▸ 导入 TPS</b>。", "es": "Pulsa <b>Nuevo</b> y elige la carpeta con tus fotos para crear un proyecto, o <b>Abrir</b> para continuar un proyecto de Landmark Studio (.lmproj). Para traer un archivo TPS, usa <b>Archivo ▸ Importar TPS</b>."}, "welcome.p2": {"en": "The project is written only when you save it (File ▸ Save). Image paths are stored relative to the project: if you move the whole folder (photos + project) it keeps working.", "zh": "项目仅在你保存时写入（文件 ▸ 保存）。图像路径以相对于项目文件的方式保存：整体移动文件夹（照片 + 项目）后仍可正常使用。", "es": "El proyecto solo se escribe cuando lo guardas (Archivo ▸ Guardar). Las rutas a las imágenes son relativas: si mueves la carpeta completa (fotos + proyecto) seguirá funcionando."}, "welcome.last": {"en": "Open last: %s", "zh": "打开上次的项目：%s", "es": "Abrir último: %s"}, "welcome.recover": {"en": "Recover unsaved session", "zh": "恢复未保存的会话", "es": "Recuperar sesión sin guardar"}, "welcome.howto": {"en": "How it works", "zh": "使用说明", "es": "Cómo se usa"}, "n.recoverFail": {"en": "The temporary backup cannot be read.", "zh": "无法读取临时备份。", "es": "La copia temporal no se puede leer."}, "n.recovered": {"en": "Session recovered. Use “Save as…” to save it.", "zh": "会话已恢复。请使用“另存为…”保存。", "es": "Sesión recuperada. Usa «Guardar como…» para guardarla."}, "new.title": {"en": "New project", "zh": "新建项目", "es": "Nuevo proyecto"}, "new.folder": {"en": "Folder: ", "zh": "文件夹：", "es": "Carpeta: "}, "new.name": {"en": "Project name", "zh": "项目名称", "es": "Nombre del proyecto"}, "new.sub": {"en": "Include subfolders", "zh": "包含子文件夹", "es": "Incluir subcarpetas"}, "new.random": {"en": "Random order (“blind” digitizing, e.g. for measurement error)", "zh": "随机顺序（“盲法”数字化，例如用于评估测量误差）", "es": "Orden aleatorio (digitalización «a ciegas», p. ej. para error de medida)"}, "new.useTmpl": {"en": "Use the current template (%d landmarks, %d curves)", "zh": "使用当前模板（%d 个标志点，%d 条曲线）", "es": "Usar la plantilla actual (%d landmarks, %d curvas)"}, "new.saveIn": {"en": "Save the project inside the image folder (recommended)", "zh": "将项目保存在图像文件夹中（推荐）", "es": "Guardar el proyecto dentro de la carpeta de imágenes (recomendado)"}, "new.create": {"en": "Create project", "zh": "创建项目", "es": "Crear proyecto"}, "new.found": {"en": "%d images found", "zh": "找到 %d 张图像", "es": "%d imágenes encontradas"}, "new.dupTitle": {"en": "Repeated file names", "zh": "文件名重复", "es": "Nombres de archivo repetidos"}, "new.dup": {"en": "They would give duplicate IDs: %s. They will be numbered automatically (_2, _3…).", "zh": "这会导致 ID 重复：%s。将自动编号（_2、_3…）。", "es": "Darían IDs duplicados: %s. Se numerarán automáticamente (_2, _3…)."}, "new.none": {"en": "There are no images in that folder.", "zh": "该文件夹中没有图像。", "es": "No hay imágenes en esa carpeta."}, "new.exists": {"en": "“%s” already exists in the folder. Open it with “Open” or choose another name.", "zh": "文件夹中已存在“%s”。请用“打开”打开它，或换一个名称。", "es": "Ya existe «%s» en la carpeta. Ábrelo con «Abrir» o elige otro nombre."}, "tps.imported": {"en": "TPS imported: %d specimens.", "zh": "已导入 TPS：%d 个标本。", "es": "TPS importado: %d especímenes."}, "tps.generic": {"en": "A generic template was created: name the landmarks in “Template”.", "zh": "已创建通用模板：请在“模板”中为标志点命名。", "es": "Se ha creado una plantilla genérica: pon nombres a los landmarks en «Plantilla»."}, "tps.commas": {"en": "The file used decimal commas: they have been converted to points.", "zh": "文件使用了小数逗号，已转换为小数点。", "es": "El archivo tenía comas decimales: se han convertido a puntos."}, "tps.saveAs": {"en": "Use “Save as…” to save it as a project.", "zh": "请使用“另存为…”将其保存为项目。", "es": "Usa «Guardar como…» para guardarlo como proyecto."}, "tmpl.title": {"en": "Landmark and semilandmark template", "zh": "标志点与半标志点模板", "es": "Plantilla de landmarks y semilandmarks"}, "tmpl.intro": {"en": "One line per element, in the order they will be digitized. Lines starting with # are comments.", "zh": "每行一个元素，按数字化的顺序排列。以 # 开头的行为注释。", "es": "Una línea por elemento, en el orden en que se digitalizarán. Las líneas que empiezan por # son comentarios."}, "tmpl.example": {"en": "LM: Snout tip\nLM: Eye, anterior edge\nLM: Base of caudal fin\nCURVE: Dorsal outline | n=12 | from=1 | to=3", "zh": "LM: 吻端\nLM: 眼前缘\nLM: 尾鳍基部\n曲线: 背部轮廓 | n=12 | 从=1 | 到=3", "es": "LM: Punta del hocico\nLM: Ojo, borde anterior\nLM: Base de la aleta caudal\nCURVA: Contorno dorsal | n=12 | desde=1 | hasta=3"}, "tmpl.help": {"en": "<b>CURVE</b>: n = number of semilandmarks. <b>from / to</b> (optional) = landmark where the curve starts and ends, by number or name; the semilandmarks are evenly spaced between them. Without anchors, the first and last semilandmarks sit at the ends of the trace. Keywords can be written in English (CURVE, from, to), Chinese (曲线, 从, 到) or Spanish (CURVA, desde, hasta). <b>LINE: 1-2, 2-3</b> (optional) = straight lines between landmarks, used for plots.", "zh": "<b>曲线</b>：n = 半标志点数量。<b>从 / 到</b>（可选）= 曲线起止处的标志点，可用编号或名称；半标志点在两者之间等距分布。若不设锚点，第一个和最后一个半标志点位于描线的两端。关键字可用中文（曲线、从、到）、英文（CURVE、from、to）或西班牙文（CURVA、desde、hasta）。 <b>连线: 1-2, 2-3</b>（可选）= 标志点之间的直线，用于绘图。", "es": "<b>CURVA</b>: n = número de semilandmarks. <b>desde / hasta</b> (opcional) = landmark donde empieza y termina la curva, por número o por nombre; los semilandmarks quedan repartidos a la misma distancia entre ellos. Sin anclas, el primero y el último están en los extremos del trazo. Las palabras clave pueden ir en español (CURVA, desde, hasta), inglés (CURVE, from, to) o chino (曲线, 从, 到). <b>LÍNEA: 1-2, 2-3</b> (opcional) = líneas rectas entre landmarks, para los gráficos."}, "tmpl.file": ssing landmarks", "zh": "# 估计缺失的标志点", "es": "# estima los landmarks ausentes"}, "err.notProject": {"en": "The file is not a Landmark Studio project.", "zh": "该文件不是 Landmark Studio 项目文件。", "es": "El archivo no es un proyecto de Landmark Studio."}, "err.docx": {"en": "To read .docx install the 'officer' package.", "zh": "要读取 .docx，请安装 'officer' 包。", "es": "Para leer .docx instala el paquete 'officer'."}, "tp.noN": {"en": "Curve '%s': n= (number of semilandmarks) is missing.", "zh": "曲线“%s”：缺少 n=（半标志点数量）。", "es": "Curva '%s': falta n= (número de semilandmarks)."}, "tp.noLm": {"en": "Curve '%s': landmark '%s' does not exist.", "zh": "曲线“%s”：标志点“%s”不存在。", "es": "Curva '%s': no existe el landmark '%s'."}, "tp.dupNames": {"en": "Repeated names in the template: %s", "zh": "模板中有重复名称：%s", "es": "Nombres repetidos en la plantilla: %s"}, "tps.noBlocks": {"en": "No LM= blocks were found in the file.", "zh": "文件中未找到 LM= 数据块。", "es": "No se encontraron bloques LM= en el archivo."}, "tps.diffK": {"en": "Specimens have different numbers of landmarks: %s", "zh": "标本的标志点数量不一致：%s", "es": "Los especímenes tienen distinto número de landmarks: %s"}, "gen.curve": {"en": "Curve %d", "zh": "曲线 %d", "es": "Curva %d"}, "chk.noTmplT": {"en": "No template", "zh": "无模板", "es": "Sin plantilla"}, "chk.noTmpl": {"en": "Define the landmarks before exporting.", "zh": "导出前请先定义标志点。", "es": "Define los landmarks antes de exportar."}, "chk.noSpecT": {"en": "No specimens", "zh": "无标本", "es": "Sin especímenes"}, "chk.noSpec": {"en": "The project has no images.", "zh": "项目中没有图像。", "es": "El proyecto no tiene imágenes."}, "chk.emptyIdT": {"en": "Empty IDs", "zh": "ID 为空", "es": "IDs vacíos"}, "chk.emptyId": {"en": "%d specimens without ID.", "zh": "%d 个标本没有 ID。", "es": "%d especímenes sin ID."}, "chk.dupIdT": {"en": "Duplicate IDs", "zh": "ID 重复", "es": "IDs duplicados"}, "chk.dupId": {"en": "Each specimen needs a unique ID. Repeated: %s", "zh": "每个标本都需要唯一的 ID。重复的：%s", "es": "Cada espécimen debe tener un ID único. Repetidos: %s"}, "chk.spaceIdT": {"en": "IDs with spaces", "zh": "ID 含空格", "es": "IDs con espacios"}, "chk.spaceId": {"en": "Some programs cut the ID at the space: %s", "zh": "有些程序会在空格处截断 ID：%s", "es": "Algunos programas cortan el ID en el espacio: %s"}, "chk.noImgT": {"en": "Images not found", "zh": "找不到图像", "es": "Imágenes no encontradas"}, "chk.noImg": {"en": "%d images are not at their path. Use “Find image folder”. %s", "zh": "%d 张图像不在原路径。请使用“查找图像文件夹”。%s", "es": "%d imágenes no están en su ruta. Usa «Buscar carpeta de imágenes». %s"}, "chk.noScaleT": {"en": "No scale", "zh": "无比例尺", "es": "Sin escala"}, "chk.noScale": {"en": "No specimen has a scale: size (centroid size) will be in pixels.", "zh": "没有任何标本设置比例尺：大小（质心大小）将以像素为单位。", "es": "Ningún espécimen tiene escala: el tamaño (centroid size) quedará en píxeles."}, "chk.partScaleT": {"en": "Incomplete scale", "zh": "比例尺不完整", "es": "Escala incompleta"}, "chk.partScale": {"en": "%d specimens without scale: %s. Mixing scaled and unscaled specimens invalidates size.", "zh": "%d 个标本没有比例尺：%s。混用有比例尺和无比例尺的标本会使大小数据失效。", "es": "%d especímenes sin escala: %s. Mezclar escalados y no escalados invalida el tamaño."}, "chk.emptyT": {"en": "Specimens not digitized", "zh": "未数字化的标本", "es": "Especímenes sin digitalizar"}, "chk.unplacedT": {"en": "Unplaced landmarks", "zh": "未放置的标志点", "es": "Landmarks sin colocar"}, "chk.unplaced": {"en": "%d incomplete specimens (exported as -1 -1): %s. If the structure is absent, mark it as missing (key A).", "zh": "%d 个不完整的标本（导出为 -1 -1）：%s。如果该结构确实缺失，请将其标记为缺失（A 键）。", "es": "%d especímenes incompletos (se exportan como -1 -1): %s. Si falta la estructura, márcalo como ausente (tecla A)."}, "chk.noCurveT": {"en": "Curves not drawn", "zh": "未绘制的曲线", "es": "Curvas sin dibujar"}, "chk.missingT": {"en": "Missing landmarks", "zh": "缺失的标志点", "es": "Landmarks ausentes"}, "chk.missing": {"en": "%d landmarks marked as missing in %d specimens. They are exported as -1 -1: read them with readland.tps(..., negNA = TRUE) and estimate them with estimate.missing().", "zh": "%d 个标志点（分布在 %d 个标本中）被标记为缺失。它们导出为 -1 -1：用 readland.tps(..., negNA = TRUE) 读取，并用 estimate.missing() 估计。", "es": "%d landmarks marcados como ausentes en %d especímenes. Se exportan como -1 -1: léelos con readland.tps(..., negNA = TRUE) y estímalos con estimate.missing()."}, "chk.flipT": {"en": "Mirrored images", "zh": "镜像图像", "es": "Imágenes espejadas"}, "chk.flip": {"en": "%d specimens with Flip X; they are exported mirrored if the option is left on.", "zh": "%d 个标本已水平翻转；若保持该选项开启，导出时将应用镜像。", "es": "%d especímenes con Flip X; se exportan espejados si dejas activada la opción."}, "qc.minLm": {"en": "At least 3 landmarks are needed in the template.", "zh": "模板中至少需要 3 个标志点。", "es": "Hacen falta al menos 3 landmarks en la plantilla."}, "qc.minSpec": {"en": "At least 4 specimens with all landmarks are needed (there are %d).", "zh": "至少需要 4 个所有标志点齐全的标本（目前有 %d 个）。", "es": "Hacen falta al menos 4 especímenes con todos los landmarks (hay %d)."}, "qc.mirror": {"en": "Mirrored image? Try Flip X", "zh": "图像被镜像？请尝试水平翻转", "es": "¿Imagen espejada? Prueba Flip X"}, "qc.swap": {"en": "Landmarks %d and %d swapped?", "zh": "标志点 %d 和 %d 顺序颠倒？", "es": "¿Intercambiados LM %d y %d?"}, "help.title": {"en": "How it works", "zh": "使用说明", "es": "Cómo se usa"}, "help.html": {"en": "<h4>Workflow</h4>\n<ol>\n<li><b>New</b>: choose the folder with the photos. The project (.lmproj) is created in that folder and saves itself.</li>\n<li><b>Template</b>: type or load the list of landmarks and curves (the teacher can hand it out as a .txt).</li>\n<li>Digitize: the selected landmark (yellow in the panel) is placed with one click and the next one is selected.</li>\n<li><b>Scale</b>: mark two points on the ruler and type the mm. “→ unscaled” copies the factor to photos taken at the same magnification.</li>\n<li><b>Review</b>: finds duplicate IDs, photos without scale, forgotten or swapped landmarks and mirrored images.</li>\n<li><b>Export TPS</b>: file ready for geomorph, MorphoJ or tpsRelw.</li>\n</ol>\n<h4>Keyboard shortcuts</h4>\n<table>\n<tr><td><kbd>click</kbd></td><td>place the selected landmark (dragging a placed one moves it; Shift+click places on top of another)</td></tr>\n<tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>previous / next specimen</td></tr>\n<tr><td><kbd>↑</kbd> <kbd>↓</kbd> <kbd>Tab</kbd></td><td>previous / next landmark or curve</td></tr>\n<tr><td><kbd>A</kbd></td><td>mark the landmark as missing (broken or hidden structure)</td></tr>\n<tr><td><kbd>Del</kbd></td><td>delete the selected landmark or curve</td></tr>\n<tr><td><kbd>Enter</kbd> / double-click</td><td>finish the curve</td></tr>\n<tr><td><kbd>Backspace</kbd></td><td>remove the last point of the curve being drawn</td></tr>\n<tr><td><kbd>Esc</kbd></td><td>cancel the curve being drawn / leave scale mode</td></tr>\n<tr><td><kbd>E</kbd></td><td>scale mode</td></tr>\n<tr><td>wheel, <kbd>+</kbd> <kbd>-</kbd> <kbd>F</kbd></td><td>zoom and fit</td></tr>\n<tr><td>right/middle button or <kbd>Space</kbd>+drag</td><td>pan the image</td></tr>\n<tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd></td><td>undo</td></tr>\n<tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>save</td></tr>\n</table>\n<h4>Semilandmark curves</h4>\n<p>Select the curve and click along the outline (more clicks = more faithful trace). When you finish, the n semilandmarks are spaced evenly along the trace. If the curve has anchors (from / to), it starts and ends at those landmarks automatically and follows them if they move.</p>\n<h4>Moving the project</h4>\n<p>Image paths are stored relative to the .lmproj file. If you copy the whole folder to another computer it works as is. If the photos change place, use “Find image folder”.</p>", "zh": "<h4>工作流程</h4>\n<ol>\n<li><b>新建</b>：选择照片所在的文件夹。项目文件（.lmproj）会创建在该文件夹中，并自动保存。</li>\n<li><b>模板</b>：输入或加载标志点和曲线列表（教师可以用 .txt 文件分发）。</li>\n<li>数字化：所选标志点（面板中以黄色显示）单击即可放置，随后自动选择下一个。</li>\n<li><b>比例尺</b>：在标尺上标记两个点并输入毫米数。“→ 无比例尺的”会把比例复制到放大倍数相同的照片。</li>\n<li><b>检查</b>：查找重复的 ID、没有比例尺的照片、遗漏或顺序颠倒的标志点以及镜像图像。</li>\n<li><b>导出 TPS</b>：生成可直接用于 geomorph、MorphoJ 或 tpsRelw 的文件。</li>\n</ol>\n<h4>快捷键</h4>\n<table>\n<tr><td><kbd>单击</kbd></td><td>放置所选标志点（拖动已放置的点可移动它；Shift+单击可放在另一个点上）</td></tr>\n<tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>上一个 / 下一个标本</td></tr>\n<tr><td><kbd>↑</kbd> <kbd>↓</kbd> <kbd>Tab</kbd></td><td>上一个 / 下一个标志点或曲线</td></tr>\n<tr><td><kbd>A</kbd></td><td>将标志点标记为缺失（结构破损或不可见）</td></tr>\n<tr><td><kbd>Del</kbd></td><td>删除所选标志点或曲线</td></tr>\n<tr><td><kbd>Enter</kbd> / 双击</td><td>结束曲线</td></tr>\n<tr><td><kbd>Backspace</kbd></td><td>删除正在绘制的曲线的最后一个点</td></tr>\n<tr><td><kbd>Esc</kbd></td><td>取消正在绘制的曲线 / 退出比例尺模式</td></tr>\n<tr><td><kbd>E</kbd></td><td>比例尺模式</td></tr>\n<tr><td>滚轮、<kbd>+</kbd> <kbd>-</kbd> <kbd>F</kbd></td><td>缩放与适应窗口</td></tr>\n<tr><td>右键/中键 或 <kbd>空格</kbd>+拖动</td><td>平移图像</td></tr>\n<tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd></td><td>撤销</td></tr>\n<tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>保存</td></tr>\n</table>\n<h4>半标志点曲线</h4>\n<p>选择曲线后沿轮廓单击（点越多，描线越精确）。结束后，n 个半标志点会沿描线等距分布。若曲线设置了锚点（从 / 到），它会自动从这些标志点开始和结束，并在它们移动时随之调整。</p>\n<h4>移动项目</h4>\n<p>图像路径以相对于 .lmproj 文件的方式保存。将整个文件夹复制到另一台电脑后可直接使用。若照片位置改变，请使用“查找图像文件夹”。</p>", "es": "<h4>Flujo de trabajo</h4>\n<ol>\n<li><b>Nuevo</b>: elige la carpeta con las fotos. El proyecto (.lmproj) se crea en esa carpeta y se guarda solo.</li>\n<li><b>Plantilla</b>: escribe o carga la lista de landmarks y curvas (puede repartirla el profesor en un .txt).</li>\n<li>Digitaliza: el landmark seleccionado (en amarillo en el panel) se coloca con un clic y se pasa al siguiente.</li>\n<li><b>Escala</b>: marca dos puntos sobre la regla y escribe los mm. «→ sin escala» copia el factor a fotos con el mismo aumento.</li>\n<li><b>Revisar</b>: detecta IDs repetidos, fotos sin escala, landmarks olvidados, intercambiados o imágenes espejadas.</li>\n<li><b>Exportar TPS</b>: archivo listo para geomorph, MorphoJ o tpsRelw.</li>\n</ol>\n<h4>Atajos de teclado</h4>\n<table>\n<tr><td><kbd>clic</kbd></td><td>colocar el landmark seleccionado (arrastrar uno ya colocado lo mueve; Mayús+clic coloca encima de otro)</td></tr>\n<tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>espécimen anterior / siguiente</td></tr>\n<tr><td><kbd>↑</kbd> <kbd>↓</kbd> <kbd>Tab</kbd></td><td>landmark o curva anterior / siguiente</td></tr>\n<tr><td><kbd>A</kbd></td><td>marcar el landmark como ausente (estructura rota o no visible)</td></tr>\n<tr><td><kbd>Supr</kbd></td><td>borrar el landmark o la curva seleccionada</td></tr>\n<tr><td><kbd>Intro</kbd> / doble clic</td><td>terminar la curva</td></tr>\n<tr><td><kbd>Retroceso</kbd></td><td>quitar el último punto de la curva en curso</td></tr>\n<tr><td><kbd>Esc</kbd></td><td>cancelar la curva en curso / salir del modo escala</td></tr>\n<tr><td><kbd>E</kbd></td><td>modo escala</td></tr>\n<tr><td>rueda, <kbd>+</kbd> <kbd>-</kbd> <kbd>F</kbd></td><td>zoom y ajustar</td></tr>\n<tr><td>botón derecho/central o <kbd>Espacio</kbd>+arrastrar</td><td>desplazar la imagen</td></tr>\n<tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd></td><td>deshacer</td></tr>\n<tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>guardar</td></tr>\n</table>\n<h4>Curvas de semilandmarks</h4>\n<p>Selecciona la curva y haz clic a lo largo del borde (cuantos más puntos, más fiel). Al terminar, el programa reparte los n semilandmarks a la misma distancia a lo largo del trazo. Si la curva tiene anclas (desde / hasta), empieza y termina automáticamente en esos landmarks y sigue sus movimientos.</p>\n<h4>Mover el proyecto</h4>\n<p>Las rutas a las imágenes se guardan relativas al archivo .lmproj. Si copias la carpeta completa a otro ordenador funciona tal cual. Si las fotos cambian de sitio, usa «Buscar carpeta de imágenes».</p>"}, "fb.places": {"en": "Places", "zh": "位置", "es": "Lugares"}, "fb.project": {"en": "Project folder", "zh": "项目文件夹", "es": "Carpeta del proyecto"}, "fb.home": {"en": "Home", "zh": "主目录", "es": "Inicio"}, "fb.desktop": {"en": "Desktop", "zh": "桌面", "es": "Escritorio"}, "fb.documents": {"en": "Documents" cto."}, "sa.name": {"en": "Project name", "zh": "项目名称", "es": "Nombre del proyecto"}, "sa.where": {"en": "The project and its TPS are saved in the project folder “%s”, next to the images.", "zh": "项目及其 TPS 文件保存在项目文件夹“%s”中，与图像放在一起。", "es": "El proyecto y su TPS se guardan en la carpeta del proyecto «%s», junto a las imágenes."}, "sa.download": {"en": "This browser downloads the files (usually to Downloads). Move them into the image folder.", "zh": "此浏览器会下载文件（通常到“下载”文件夹）。请将它们移到图像文件夹中。", "es": "Este navegador descarga los archivos (normalmente a Descargas). Muévelos a la carpeta de las imágenes."}, "rescan.done": {"en": "%d new specimens; %d images found again.", "zh": "新增 %d 个标本；重新找到 %d 张图像。", "es": "%d especímenes nuevos; %d imágenes vueltas a encontrar."}, "app.mismatchT": {"en": "The TPS file does not match the template", "zh": "TPS 文件与模板不匹配", "es": "El archivo TPS no coincide con la plantilla"}, "app.mismatch": {"en": "The file has %s landmarks and curves of %s points; the project has %s landmarks and curves of %s semilandmarks.", "zh": "该文件有 %s 个标志点和 %s 个点的曲线；项目有 %s 个标志点和 %s 个半标志点的曲线。", "es": "El archivo tiene %s landmarks y curvas de %s puntos; el proyecto tiene %s landmarks y curvas de %s semilandmarks."}, "app.mismatchHint": {"en": "No specimens were added. Both must have the same number of landmarks and curves.", "zh": "未添加任何标本。两者的标志点和曲线数量必须相同。", "es": "No se ha añadido ningún espécimen. Ambos deben tener el mismo número de landmarks y de curvas."}, "app.done": {"en": "%d specimens appended from %s.", "zh": "已追加 %d 个标本（来自 %s）。", "es": "%d especímenes añadidos desde %s."}, "app.renamed": {"en": "%d IDs already existed and were renamed (_2, _3…).", "zh": "%d 个 ID 已存在，已重命名（_2、_3…）。", "es": "%d IDs ya existían y se han renombrado (_2, _3…)."}, "app.noImg": {"en": "%d of the appended specimens have no image in the project folder.", "zh": "追加的标本中有 %d 个在项目文件夹中没有图像。", "es": "%d de los especímenes añadidos no tienen imagen en la carpeta del proyecto."}, "rm.title": {"en": "Remove specimen", "zh": "删除标本", "es": "Quitar espécimen"}, "rm.body": {"en": "Remove %s from the project (it has %d landmarks/curves placed)?", "zh": "从项目中删除 %s（已放置 %d 个标志点/曲线）？", "es": "¿Quitar %s del proyecto (tiene %d landmarks/curvas colocados)?"}, "rm.note": {"en": "The image file is not deleted. You can add it again later with Specimens ▸ Add specimens from images.", "zh": "图像文件不会被删除。以后可以通过“标本 ▸ 从图像添加标本”再次添加。", "es": "El archivo de imagen no se borra. Puedes volver a añadirlo con Especímenes ▸ Añadir especímenes desde imágenes."}, "rm.ok": {"en": "Remove", "zh": "删除", "es": "Quitar"}, "set.tps": {"en": "TPS file written on saving", "zh": "保存时写入的 TPS 文件", "es": "Archivo TPS que se escribe al guardar"}, "set.view": {"en": "Digitizing", "zh": "数字化", "es": "Digitalización"}, "set.dlCurveslide": {"en": "Download curveslide table", "zh": "下载 curveslide 表", "es": "Descargar tabla curveslide"}, "set.dlNames": {"en": "Download names table", "zh": "下载名称表", "es": "Descargar tabla de nombres"}, "set.noCurves": {"en": "The template has no sliding semilandmarks.", "zh": "模板中没有滑动半标志点。", "es": "La plantilla no tiene semilandmarks deslizantes."}, "welcome.p1web": {"en": "Click <b>New</b> and choose the folder with your photos, then choose the name and place of the project file. <b>Open</b> continues a project made with Landmark Studio (.lmproj); to bring in a TPS file, use <b>File ▸ Import TPS</b>.", "zh": "点击<b>新建</b>并选择照片所在的文件夹，然后选择项目文件的名称和位置。<b>打开</b>可继续用 Landmark Studio 制作的项目（.lmproj）；要导入 TPS 文件，请使用<b>文件 ▸ 导入 TPS</b>。", "es": "Pulsa <b>Nuevo</b> y elige la carpeta con tus fotos; después elige el nombre y el lugar del archivo de proyecto. <b>Abrir</b> continúa un proyecto hecho con Landmark Studio (.lmproj); para traer un archivo TPS, usa <b>Archivo ▸ Importar TPS</b>."}, "welcome.p2web": {"en": "Saving writes a single project file (.lmproj), with the name and in the place you choose. TPS and other files are only written when you export them.", "zh": "保存时只写入一个项目文件（.lmproj），名称和位置由你选择。TPS 等其他文件仅在导出时写入。", "es": "Al guardar se escribe un único archivo de proyecto (.lmproj), con el nombre y en el lugar que elijas. El TPS y otros archivos solo se escriben cuando los exportas."}, "welcome.recent": {"en": "Recent projects", "zh": "最近的项目", "es": "Proyectos recientes"}, "welcome.recoverT": {"en": "Unsaved work found", "zh": "发现未保存的工作", "es": "Hay trabajo sin guardar"}, "welcome.recoverP": {"en": "Project “%s”, %s. ", "zh": "项目“%s”，%s。", "es": "Proyecto «%s», %s. "}, "compat.title": {"en": "Limited mode in this browser", "zh": "此浏览器处于受限模式", "es": "Modo limitado en este navegador"}, "compat.body": {"en": "This browser cannot save directly into a folder: you will choose the folder each time and “Save” will download the files. For the full version use Microsoft Edge or Google Chrome.", "zh": "此浏览器无法直接保存到文件夹：每次都需要选择文件夹，“保存”会下载文件。完整功能请使用 Microsoft Edge 或 Google Chrome。", "es": "Este navegador no puede guardar directamente en una carpeta: elegirás la carpeta cada vez y «Guardar» descargará los archivos. Para la versión completa usa Microsoft Edge o Google Chrome."}, "rec.gone": {"en": "“%s” is no longer in that folder.", "zh": "“%s”已不在该文件夹中。", "es": "«%s» ya no está en esa carpeta."}, "rec.fail": {"en": "Could not open the folder: %s", "zh": "无法打开文件夹：%s", "es": "No se pudo abrir la carpeta: %s"}, "rec.how": {"en": "Choose the image folder of the project (it was “%s”). The recovered data will be loaded and saved there.", "zh": "请选择项目的图像文件夹（原为“%s”）。恢复的数据将加载并保存到那里。", "es": "Elige la carpeta de imágenes del proyecto (era «%s»). Los datos recuperados se cargarán y se guardarán allí."}, "fs.cannotOpen": {"en": "Could not open the folder: %s", "zh": "无法打开文件夹：%s", "es": "No se pudo abrir la carpeta: %s"}, "help.htmlWeb": {"en": "<h4>Workflow</h4><ol><li><b>New</b>: choose the folder with the photos (subfolders allowed). The project is created in that folder.</li><li><b>Specimens ▸ Template</b>: type or load the list of landmarks and curves (the teacher can hand it out as a .txt).</li><li>Digitize with the four modes: <kbd>1</kbd> Landmarks, <kbd>2</kbd> Semilandmarks, <kbd>3</kbd> Scale, <kbd>4</kbd> Outlines and lines. The second row of the bar shows the tools of the selected mode.</li><li><b>File ▸ Save</b> writes one file, <i>name.lmproj</i>, with everything; the first time it asks for the name and the place. Nothing is written until you save (Ctrl+S). <b>File ▸ Export as TPS</b> writes the TPS for geomorph, MorphoJ or tpsRelw.</li><li><b>Review</b>: tells you whether the file has errors and which ones: duplicate IDs, photos without scale, forgotten or swapped landmarks, mirrored images.</li></ol><h4>Modes</h4><table><tr><td><kbd>1</kbd> Landmarks</td><td><b>+ Add landmark</b> (<kbd>N</kbd>) creates a landmark and the next click places it; click places the selected landmark and moves to the next; drag to move; <kbd>A</kbd> = missing (NA). <b>Import names…</b> takes the names from a .txt or Word file (one per line, in order). Click a name in the list to rename it. The bar warns when a specimen has a different number of landmarks. <b>Delete for all specimens</b> removes the selected landmark (or, in Semilandmarks, the selected curve) from the template and from every specimen.</td></tr><tr><td><kbd>2</kbd> Semilandmarks</td><td>click on a landmark, then along the outline, and finish on another landmark (<kbd>Enter</kbd> finishes on the nearest one, <kbd>Esc</kbd> cancels). Each curve has its own number of semilandmarks, optionally smoothed first. The arrow shows the direction: it is the same in every specimen, and a curve drawn backwards is reversed automatically. <b>+ Add curve</b> (<kbd>N</kbd>) starts a new curve; <b>NA</b> (<kbd>A</kbd>) marks the selected curve as missing in this specimen (all its semilandmarks are exported as NA).</td></tr><tr><td><kbd>3</kbd> Scale</td><td>click both ends of a known distance on the ruler and type the mm; hold <kbd>Shift</kbd> to draw at 0°/45°/90°</td></tr><tr><td><kbd>4</kbd> Outlines and lines</td><td><b>Outlines</b> (green, not semilandmarks): each click adds a point, <kbd>Enter</kbd>/<kbd>Esc</kbd> ends the stroke, <kbd>Backspace</kbd> removes the last point. <b>Lines</b> (orange): click landmarks one after another to chain straight segments, <kbd>Enter</kbd>/<kbd>Esc</kbd> releases the line; <kbd>L</kbd> switches between both. Click on an outline to select it and <kbd>Del</kbd> to delete it. <b>Import…/Export…</b>: outlines as CSV or TPS (tpsDig, CURVES/POINTS); lines as pairs of landmarks (MorphoJ wireframe, geomorph links) or as a tpsRelw links file.</td></tr></table><p><b>Flip X / Flip Y</b>: with a photo, the photo is mirrored (left-right / up-down) and the coordinates are mirrored on export; without a photo, the landmarks themselves are reflected.</p><h4>Keyboard</h4><table><tr><td><kbd>&larr;</kbd> <kbd>&rarr;</kbd></td><td>previous / next specimen</td></tr><tr><td><kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>Tab</kbd></td><td>previous / next landmark or curve</td></tr><tr><td><kbd>Del</kbd></td><td>delete the selected landmark, curve or scale</td></tr><tr><td><kbd>Backspace</kbd> / <kbd>Esc</kbd></td><td>remove the last curve point / cancel the curve</td></tr><tr><td>wheel, <kbd>+</kbd> <kbd>-</kbd> <kbd>F</kbd></td><td>zoom and fit</td></tr><tr><td>right/middle button or <kbd>Space</kbd>+drag</td><td>pan</td></tr><tr><td><kbd>Shift</kbd>+click</td><td>place a landmark on top of another one</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Y</kbd> / <kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>undo / redo / save</td></tr></table><h4>File menu</h4><p>New, Open, <b>Import TPS</b> (asks whether to add the specimens at the end or replace the current ones), Save, Save as, and <b>Export as TPS</b> (a TPS copy with another name, for example to send it). All photos must be in the project folder. If a TPS has no IMAGE=, its specimens are drawn on a white sheet with x and y axes (TPS coordinates).</p><h4>Specimens menu</h4><p><b>Template</b> and <b>Specimen order</b>. <b>Link images</b>: choose the folder with the photos of a TPS (they are not loaded with it). <b>Look for new images</b>: adds photos put into the folder later and finds moved ones. <b>Append from a TPS file</b>: adds the specimens of another TPS at the end (same number of landmarks and curves required). <b>Remove</b>: takes the current specimen out of the project (the image is not deleted).</p><h4>Browsers</h4><p>Edge and Chrome save directly into the chosen file (when you save) and remember recent projects. Safari and Firefox work in a limited mode: you choose the folder each time and Save downloads the files.</p>", "zh": "<h4>工作流程</h4><ol><li><b>新建</b>：选择照片所在的文件夹（可含子文件夹）。项目将创建在该文件夹中。</li><li><b>标本 ▸ 模板</b>：输入或加载标志点和曲线列表（教师可以用 .txt 文件分发）。</li><li>使用四种模式进行数字化：<kbd>1</kbd> 标志点、<kbd>2</kbd> 半标志点、<kbd>3</kbd> 比例尺、<kbd>4</kbd> 轮廓和连线。工具栏第二行显示所选模式的工具。</li><li><b>文件 ▸ 保存</b>只写入一个包含全部信息的文件 <i>名称.lmproj</i>；第一次会询问名称和位置。在你保存（Ctrl+S）之前不会写入任何内容。<b>文件 ▸ 导出为 TPS</b>会写入用于 geomorph、MorphoJ 或 tpsRelw 的 TPS 文件。</li><li><b>检查</b>：告诉你文件是否有错误以及是哪些错误：重复的 ID、没有比例尺的照片、遗漏或顺序颠倒的标志点、镜像图像。</li></ol><h4>模式</h4><table><tr><td><kbd>1</kbd> 标志点</td><td>“+ 添加标志点”（<kbd>N</kbd>）创建标志点，下一次单击即放置；单击放置所选标志点并进入下一个；拖动可移动；<kbd>A</kbd> = 缺失 (NA)。“导入名称…”可从 .txt 或 Word 文件读取名称（每行一个，按顺序）。单击列表中的名称可重命名。标本数量不同时会提示。“从所有标本中删除”会从模板和所有标本中删除所选标志点（在半标志点模式下为所选曲线）。</td></tr><tr><td><kbd>2</kbd> 半标志点</td><td>单击一个标志点，再沿轮廓单击，并在另一个标志点结束（<kbd>Enter</kbd> 在最近的标志点结束，<kbd>Esc</kbd> 取消）。每条曲线有自己的半标志点数量，可先平滑。箭头表示方向：所有标本方向一致，反向绘制会自动纠正。“+ 添加曲线”（<kbd>N</kbd>）开始一条新曲线；“NA”（<kbd>A</kbd>）将所选曲线在此标本中标记为缺失（其所有半标志点都导出为 NA）。</td></tr><tr><td><kbd>3</kbd> 比例尺</td><td>在标尺上点击已知距离的两端并输入毫米数；按住 <kbd>Shift</kbd> 可按 0°/45°/90° 绘制</td></tr><tr><td><kbd>4</kbd> 轮廓和连线</td><td><b>轮廓</b>（绿色，不是半标志点）：每次单击添加一个点，<kbd>Enter</kbd>/<kbd>Esc</kbd> 结束，<kbd>Backspace</kbd> 删除最后一个点。<b>连线</b>（橙色）：依次单击标志点连成直线段，<kbd>Enter</kbd>/<kbd>Esc</kbd> 结束；<kbd>L</kbd> 切换两者。单击轮廓可选中，按 <kbd>Del</kbd> 删除。“导入…/导出…”：轮廓为 CSV 或 TPS（tpsDig，CURVES/POINTS）；连线为标志点对（MorphoJ 线框、geomorph links）或 tpsRelw 连线文件。</td></tr></table><p><b>水平翻转 / 垂直翻转</b>：有照片时，照片镜像（左右 / 上下），导出时坐标随之镜像；无照片时，直接反射标志点。</p><h4>快捷键</h4><table><tr><td><kbd>&larr;</kbd> <kbd>&rarr;</kbd></td><td>上一个 / 下一个标本</td></tr><tr><td><kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>Tab</kbd></td><td>上一个 / 下一个标志点或曲线</td></tr><tr><td><kbd>Del</kbd></td><td>删除所选标志点、曲线或比例尺</td></tr><tr><td><kbd>Backspace</kbd> / <kbd>Esc</kbd></td><td>删除曲线最后一个点 / 取消曲线</td></tr><tr><td>滚轮、<kbd>+</kbd> <kbd>-</kbd> <kbd>F</kbd></td><td>缩放与适应窗口</td></tr><tr><td>右键/中键 或 <kbd>空格</kbd>+拖动</td><td>平移</td></tr><tr><td><kbd>Shift</kbd>+单击</td><td>在另一个标志点上放置标志点</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Y</kbd> / <kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>撤销 / 重做 / 保存</td></tr></table><h4>文件菜单</h4><p>新建、打开、<b>导入 TPS</b>（会询问是添加到末尾还是替换当前标本）、保存、另存为，以及<b>导出为 TPS</b>（以其他名称保存一份 TPS 副本，例如用于发送）。所有照片都必须放在项目文件夹中。如果 TPS 没有 IMAGE=，其标本会绘制在带 x、y 坐标轴的白色背景上（TPS 坐标）。</p><h4>标本菜单</h4><p><b>模板</b>和<b>标本顺序</b>。<b>链接图像</b>：选择 TPS 照片所在的文件夹（照片不会随 TPS 加载）。<b>查找新图像</b>：添加后来放入文件夹的照片，并找回被移动的照片。<b>从 TPS 文件追加</b>：在末尾添加另一个 TPS 文件中的标本（标志点和曲线数量必须相同）。<b>删除</b>：将当前标本从项目中移除（图像文件不会被删除）。</p><h4>浏览器</h4><p>Edge 和 Chrome 会在你保存时直接写入所选文件，并记住最近的项目。Safari 和 Firefox 以受限模式运行：每次都要选择文件夹，“保存”会下载文件。</p>", "es": "<h4>Flujo de trabajo</h4><ol><li><b>Nuevo</b>: elige la carpeta con las fotos (puede tener subcarpetas). El proyecto se crea en esa carpeta.</li><li><b>Especímenes ▸ Plantilla</b>: escribe o carga la lista de landmarks y curvas (el profesor puede repartirla en un .txt).</li><li>Digitaliza con los cuatro modos: <kbd>1</kbd> Landmarks, <kbd>2</kbd> Semilandmarks, <kbd>3</kbd> Escala, <kbd>4</kbd> Contornos y líneas. La segunda fila de la barra muestra las herramientas del modo elegido.</li><li><b>Archivo ▸ Guardar</b> escribe un único archivo, <i>nombre.lmproj</i>, con todo; la primera vez pregunta el nombre y el lugar. No se escribe nada hasta que guardas (Ctrl+S). <b>Archivo ▸ Exportar como TPS</b> escribe el TPS para geomorph, MorphoJ o tpsRelw.</li><li><b>Revisar</b>: te dice si el archivo tiene errores y cuáles: IDs repetidos, fotos sin escala, landmarks olvidados o intercambiados, imágenes espejadas.</li></ol><h4>Modos</h4><table><tr><td><kbd>1</kbd> Landmarks</td><td>«+ Añadir landmark» (<kbd>N</kbd>) crea un landmark y el siguiente clic lo coloca; el clic coloca el landmark seleccionado y pasa al siguiente; arrastra para moverlo; <kbd>A</kbd> = ausente (NA). «Importar nombres…» toma los nombres de un .txt o Word (uno por línea, en orden). Clic en un nombre de la lista para cambiarlo. La barra avisa si un espécimen tiene un número distinto de landmarks. «Eliminar en todos» quita el landmark seleccionado (o, en Semilandmarks, la curva seleccionada) de la plantilla y de todos los especímenes.</td></tr><tr><td><kbd>2</kbd> Semilandmarks</td><td>clic en un landmark, luego a lo largo del borde, y termina en otro landmark (<kbd>Intro</kbd> termina en el más cercano, <kbd>Esc</kbd> cancela). Cada curva tiene su propio número de semilandmarks, opcionalmente suavizada antes. La flecha indica el sentido: es el mismo en todos los especímenes y si dibujas una curva al revés se invierte sola. «+ Añadir curva» (<kbd>N</kbd>) empieza una curva nueva; «NA» (<kbd>A</kbd>) marca la curva seleccionada como ausente en este espécimen (todos sus semilandmarks se exportan como NA).</td></tr><tr><td><kbd>3</kbd> Escala</td><td>clic en los dos extremos de una distancia conocida de la regla y escribe los mm; mantén <kbd>Mayús</kbd> para trazar a 0°/45°/90°</td></tr><tr><td><kbd>4</kbd> Contornos y líneas</td><td><b>Contornos</b> (verdes, no son semilandmarks): cada clic añade un punto, <kbd>Intro</kbd>/<kbd>Esc</kbd> termina el trazo, <kbd>Retroceso</kbd> quita el último punto. <b>Líneas</b> (naranjas): clic en landmarks uno tras otro para encadenar segmentos rectos, <kbd>Intro</kbd>/<kbd>Esc</kbd> suelta la línea; <kbd>L</kbd> cambia entre las dos. Clic en un contorno para seleccionarlo y <kbd>Supr</kbd> para borrarlo. <b>Importar…/Exportar…</b>: contornos en CSV o TPS (tpsDig, CURVES/POINTS); líneas como pares de landmarks (wireframe de MorphoJ, links de geomorph) o como archivo de links de tpsRelw.</td></tr></table><p><b>Flip X / Flip Y</b>: con foto, la foto se ve reflejada (izquierda-derecha / arriba-abajo) y las coordenadas se reflejan al exportar; sin foto, se reflejan los propios landmarks.</p><h4>Teclado</h4><table><tr><td><kbd>&larr;</kbd> <kbd>&rarr;</kbd></td><td>espécimen anterior / siguiente</td></tr><tr><td><kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>Tab</kbd></td><td>landmark o curva anterior / siguiente</td></tr><tr><td><kbd>Supr</kbd></td><td>borrar el landmark, la curva o la escala seleccionada</td></tr><tr><td><kbd>Retroceso</kbd> / <kbd>Esc</kbd></td><td>quitar el último punto de la curva / cancelar la curva</td></tr><tr><td>rueda, <kbd>+</kbd> <kbd>-</kbd> <kbd>F</kbd></td><td>zoom y ajustar</td></tr><tr><td>botón derecho/central o <kbd>Espacio</kbd>+arrastrar</td><td>desplazar</td></tr><tr><td><kbd>Mayús</kbd>+clic</td><td>colocar un landmark encima de otro</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Y</kbd> / <kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>deshacer / rehacer / guardar</td></tr></table><h4>Menú Archivo</h4><p>Nuevo, Abrir, <b>Importar TPS</b> (pregunta si añadir los especímenes al final o reemplazar los actuales), Guardar, Guardar como y <b>Exportar como TPS</b> (una copia del TPS con otro nombre, por ejemplo para enviarla). Todas las fotos deben estar en la carpeta del proyecto. Si un TPS no tiene IMAGE=, sus especímenes se dibujan sobre fondo blanco con ejes x e y (coordenadas del TPS).</p><h4>Menú Especímenes</h4><p><b>Plantilla</b> y <b>Orden de los especímenes</b>. <b>Enlazar imágenes</b>: elige la carpeta con las fotos de un TPS (no se cargan con él). <b>Buscar imágenes nuevas</b>: añade las fotos que se pusieron después en la carpeta y encuentra las movidas. <b>Añadir desde un TPS</b>: añade al final los especímenes de otro TPS (mismo número de landmarks y curvas). <b>Quitar</b>: saca del proyecto el espécimen actual (la imagen no se borra).</p><h4>Navegadores</h4><p>Edge y Chrome guardan directamente en el archivo elegido (cuando guardas) y recuerdan los proyectos recientes. Safari y Firefox funcionan en modo limitado: eliges la carpeta cada vez y «Guardar» descarga los archivos.</p>"}, "rm.done": {"en": "“%s” removed from the project.", "zh": "已从项目中删除“%s”。", "es": "«%s» se ha quitado del proyecto."}, "rec.pick": {"en": "Select the folder “%s” in the window that opens.", "zh": "请在打开的窗口中选择文件夹“%s”。", "es": "Selecciona la carpeta «%s» en la ventana que se abre."}, "tb.file": {"en": "File", "zh": "文件", "es": "Archivo"}, "fm.exportTps": {"en": "Export as TPS…", "zh": "导出为 TPS…", "es": "Exportar como TPS…"}, "sm.template": {"en": "Template…", "zh": "模板…", "es": "Plantilla…"}, "sm.order": {"en": "Specimen order…", "zh": "标本顺序…", "es": "Orden de los especímenes…"}, "ex.info": {"en": "Writes a copy of the data as a TPS file with this name (for example, to send it). Save already keeps the project TPS up to date.", "zh": "以此名称写入一份 TPS 数据副本（例如用于发送）。“保存”已会更新项目自身的 TPS 文件。", "es": "Escribe una copia de los datos en un TPS con este nombre (por ejemplo, para enviarlo). «Guardar» ya mantiene al día el TPS del proyecto."}, "ex.btn": {"en": "Export", "zh": "导出", "es": "Exportar"}, "ex.done": {"en": "Exported %s", "zh": "已导出 %s", "es": "Exportado %s"}, "ex.same": {"en": "That is the project TPS; Save already writes it. Choose another name.", "zh": "这是项目自身的 TPS，“保存”已会写入它。请换一个名称。", "es": "Ese es el TPS del proyecto, que ya escribe «Guardar». Elige otro nombre."}, "ex.noTmpl": {"en": "Define the template first.", "zh": "请先定义模板。", "es": "Primero define la plantilla."}, "rev.suspT": {"en": "Possible digitizing errors", "zh": "可能的数字化错误", "es": "Posibles errores de digitalización"}, "rev.susp": {"en": "These specimens fit much better with two landmarks swapped or the image mirrored. Click one to open it.", "zh": "这些标本在交换两个标志点或镜像图像后吻合得更好。点击可打开。", "es": "Estos especímenes encajan mucho mejor con dos landmarks intercambiados o con la imagen espejada. Pulsa uno para abrirlo."}, "rev.oddT": {"en": "Unusual shapes", "zh": "形状异常", "es": "Formas inusuales"}, "rev.odd": {"en": "These specimens are far from the rest: check that the landmarks are in the right place. Click one to open it.", "zh": "这些标本与其他标本差异很大：请检查标志点位置是否正确。点击可打开。", "es": "Estos especímenes se alejan mucho del resto: comprueba que los landmarks están en su sitio. Pulsa uno para abrirlo."}, "rev.sumErr": {"en": "%d error(s) and %d warning(s): fix the errors before analysing.", "zh": "%d 个错误和 %d 个警告：分析前请先修正错误。", "es": "%d error(es) y %d aviso(s): corrige los errores antes de analizar."}, "rev.sumWarn": {"en": "No errors, %d warning(s).", "zh": "没有错误，%d 个警告。", "es": "Sin errores, %d aviso(s)."}, "rev.sumOk": {"en": "No errors found: the file is ready.", "zh": "未发现错误：文件可以使用。", "es": "No se han encontrado errores: el archivo está listo."}, "mode.lines": {"en": "Lines", "zh": "连线", "es": "Líneas"}, "mode.lines.title": {"en": "Lines mode: straight segments between landmarks, for plots (key 4)", "zh": "连线模式：在标志点之间画直线段，用于绘图（按键 4）", "es": "Modo líneas: segmentos rectos entre landmarks, para los gráficos (tecla 4)"}, "lm.add": {"en": "+ Add landmark", "zh": "+ 添加标志点", "es": "+ Añadir landmark"}, "lm.add.title": {"en": "Adds a new landmark at the end of the list (N)", "zh": "在列表末尾添加一个新标志点（N）", "es": "Añade un landmark nuevo al final de la lista (N)"}, "lm.del": {"en": "Delete current", "zh": "删除当前", "es": "Borrar actual"}, "lm.del.title": {"en": "Removes the selected landmark from this specimen; if no specimen has it, removes it from the template (Del)", "zh": "从此标本中移除所选标志点；若没有标本使用它，则从模板中移除（Del）", "es": "Quita el landmark seleccionado de este espécimen; si ningún espécimen lo tiene, lo quita de la plantilla (Supr)"}, "lm.na": {"en": "NA", "zh": "NA", "es": "NA"}, "lm.none": {"en": "No landmarks yet: press ose their folder)…", "zh": "链接图像（选择所在文件夹）…", "es": "Enlazar imágenes (elegir su carpeta)…"}, "link.title": {"en": "Photos are linked separately", "zh": "照片需单独链接", "es": "Las fotos se enlazan aparte"}, "link.p1": {"en": "The TPS has been opened with its coordinates. It names %d images, but the photos are not loaded with it.", "zh": "TPS 已连同坐标一起打开。其中提到 %d 张图像，但照片不会随之加载。", "es": "El TPS se ha abierto con sus coordenadas. Nombra %d imágenes, pero las fotos no se cargan con él."}, "link.p2": {"en": "To see them, choose <b>Specimens ▸ Link images</b> and select the folder where they are (subfolders are searched too). The project will be saved in that folder. Without photos, the landmarks are shown on a white sheet with axes.", "zh": "如需查看，请选择<b>标本 ▸ 链接图像</b>并选择照片所在的文件夹（也会搜索子文件夹）。项目将保存在该文件夹中。没有照片时，标志点显示在带坐标轴的白色背景上。", "es": "Para verlas, elige <b>Especímenes ▸ Enlazar imágenes</b> y selecciona la carpeta donde están (también se buscan en subcarpetas). El proyecto se guardará en esa carpeta. Sin fotos, los landmarks se muestran sobre fondo blanco con ejes."}, "link.now": {"en": "Link now…", "zh": "立即链接…", "es": "Enlazar ahora…"}, "noimg.notLinked": {"en": "%s not linked: Specimens ▸ Link images", "zh": "%s 未链接：标本 ▸ 链接图像", "es": "%s sin enlazar: Especímenes ▸ Enlazar imágenes"}, "bar.flipY": {"en": "Flip Y", "zh": "垂直翻转", "es": "Flip Y"}, "bar.flipY.title": {"en": "Mirror up-down. With a photo: the photo is shown flipped and the coordinates are flipped on export. Without a photo: the landmarks themselves are reflected.", "zh": "上下镜像。有照片时：照片翻转显示，导出时坐标翻转。无照片时：直接反射标志点。", "es": "Espejo arriba-abajo. Con foto: la foto se ve volteada y las coordenadas se voltean al exportar. Sin foto: se reflejan los propios landmarks."}, "flag.flipY": {"en": "flip Y", "zh": "垂直翻转", "es": "flip Y"}, "flag.flipY.title": {"en": "Image flipped up-down: coordinates are flipped on export", "zh": "图像上下翻转：导出时坐标翻转", "es": "Imagen volteada arriba-abajo: las coordenadas se voltean al exportar"}, "fl.reflX": {"en": "Landmarks reflected left-right (Ctrl+Z undoes it).", "zh": "标志点已左右反射（Ctrl+Z 可撤销）。", "es": "Landmarks reflejados izquierda-derecha (Ctrl+Z lo deshace)."}, "fl.reflY": {"en": "Landmarks reflected up-down (Ctrl+Z undoes it).", "zh": "标志点已上下反射（Ctrl+Z 可撤销）。", "es": "Landmarks reflejados arriba-abajo (Ctrl+Z lo deshace)."}, "sc.cs.title": {"en": "Centroid size of this specimen: landmarks and semilandmarks, in mm if the scale is defined", "zh": "此标本的质心大小：标志点和半标志点，设定比例尺时单位为毫米", "es": "Tamaño del centroide de este espécimen: landmarks y semilandmarks, en mm si la escala está definida"}, "sst.done": {"en": "Complete", "zh": "已完成", "es": "Completo"}, "sst.partial": {"en": "%d landmarks or curves missing", "zh": "缺少 %d 个标志点或曲线", "es": "Faltan %d landmarks o curvas"}, "ex.outlines": {"en": "Include the outlines (green) as CURVES= / POINTS=", "zh": "将轮廓（绿色）作为 CURVES= / POINTS= 包含在内", "es": "Incluir los contornos (verdes) como CURVES= / POINTS="}, "ex.outlinesP": {"en": "tpsDig format, after the landmarks of each specimen. In R, readland.tps reads them only with readcurves = TRUE (and then as semilandmarks).", "zh": "tpsDig 格式，位于每个标本的标志点之后。在 R 中，readland.tps 仅在 readcurves = TRUE 时读取（并视为半标志点）。", "es": "Formato de tpsDig, detrás de los landmarks de cada espécimen. En R, readland.tps solo los lee con readcurves = TRUE (y entonces como semilandmarks)."}, "ex.outlinesNo": {"en": "The outlines (green) are not included here: in the tpsDig format CURVES= is already used by the semilandmarks. Export them from Outlines and lines ▸ Export…", "zh": "此处不包含轮廓（绿色）：在 tpsDig 格式中 CURVES= 已用于半标志点。请从“轮廓和连线 ▸ 导出…”导出。", "es": "Los contornos (verdes) no se incluyen aquí: en el formato de tpsDig CURVES= ya lo usan los semilandmarks. Expórtalos desde Contornos y líneas ▸ Exportar…"}, "credit": {"en": "by Oscar Sanisidro", "zh": "作者：Oscar Sanisidro", "es": "realizado por Oscar Sanisidro"}, "creditLong": {"en": "Landmark Studio · developed by Oscar Sanisidro", "zh": "Landmark Studio · 由 Oscar Sanisidro 开发", "es": "Landmark Studio · realizado por Oscar Sanisidro"}, "sb.todoKw": {"en": ":todo", "zh": ":未完成", "es": ":pendientes"}, "open.useImport": {"en": "Open only opens Landmark Studio projects (.lmproj). To bring in a TPS file, use File ▸ Import TPS.", "zh": "“打开”只能打开 Landmark Studio 项目（.lmproj）。要导入 TPS 文件，请使用“文件 ▸ 导入 TPS”。", "es": "Abrir solo abre proyectos de Landmark Studio (.lmproj). Para traer un archivo TPS, usa Archivo ▸ Importar TPS."}, "sc.delAll": {"en": "Delete scale for all specimens", "zh": "删除所有标本的比例尺", "es": "Borrar la escala en todos"}, "sc.delAll.title": {"en": "Removes the scale (ruler or copied value) of every specimen", "zh": "移除所有标本的比例尺（标尺或复制的数值）", "es": "Quita la escala (regla o valor copiado) de todos los especímenes"}, "sc.delAllP": {"en": "The scale of %d specimen(s) will be removed. You can undo it with Ctrl+Z.", "zh": "将移除 %d 个标本的比例尺。可用 Ctrl+Z 撤销。", "es": "Se quitará la escala de %d espécimen(es). Puedes deshacerlo con Ctrl+Z."}, "sc.delAllOk": {"en": "Delete for all", "zh": "全部删除", "es": "Borrar en todos"}, "sc.delAllNone": {"en": "No specimen has a scale.", "zh": "没有标本设置比例尺。", "es": "Ningún espécimen tiene escala."}, "sc.delAllDone": {"en": "Scale removed from %d specimen(s).", "zh": "已移除 %d 个标本的比例尺。", "es": "Escala quitada en %d espécimen(es)."}, "sc.csv": {"en": "Import from CSV…", "zh": "从 CSV 导入…", "es": "Importar de CSV…"}, "sc.csv.title": {"en": "Loads the scales from a CSV: 1st column = specimen name (ID or image name), 2nd column = scale (mm per pixel). Any order.", "zh": "从 CSV 加载比例尺：第 1 列 = 标本名称（ID 或图像名），第 2 列 = 比例（毫米/像素）。顺序不限。", "es": "Carga las escalas de un CSV: 1.ª columna = nombre del espécimen (ID o nombre de la imagen), 2.ª columna = escala (mm por píxel). En cualquier orden."}, "sc.csvT": {"en": "Import scales from CSV", "zh": "从 CSV 导入比例尺", "es": "Importar escalas de CSV"}, "sc.csvOk": {"en": "Apply", "zh": "应用", "es": "Aplicar"}, "sc.csvFound": {"en": "%d of %d specimens found in %s.", "zh": "找到 %d / %d 个标本（%s）。", "es": "Encontrados %d de %d especímenes en %s."}, "sc.csvReplace": {"en": "%d of them already have a scale: it will be replaced.", "zh": "其中 %d 个已有比例尺：将被替换。", "es": "%d de ellos ya tienen escala: se reemplazará."}, "sc.csvNotFound": {"en": "%d name(s) of the CSV are not in the project: %s", "zh": "CSV 中有 %d 个名称不在项目中：%s", "es": "%d nombre(s) del CSV no están en el proyecto: %s"}, "sc.csvBad": {"en": "%d row(s) without a valid number were skipped: %s", "zh": "已跳过 %d 行无有效数值的数据：%s", "es": "Se han saltado %d fila(s) sin un número válido: %s"}, "sc.csvMissing": {"en": "%d specimen(s) of the project are not in the CSV and keep their scale: %s", "zh": "项目中有 %d 个标本不在 CSV 中，保留原比例尺：%s", "es": "%d espécimen(es) del proyecto no están en el CSV y conservan su escala: %s"}, "sc.csvUnit": {"en": "The value is read as mm per pixel (like SCALE= in a TPS file).", "zh": "数值按毫米/像素读取（与 TPS 文件中的 SCALE= 相同）。", "es": "El valor se lee como mm por píxel (como SCALE= en un archivo TPS)."}, "sc.csvNone": {"en": "No specimen of the project was found in %s.", "zh": "在 %s 中未找到项目中的任何标本。", "es": "No se ha encontrado ningún espécimen del proyecto en %s."}, "sc.csvDone": {"en": "Scale loaded in %d specimen(s).", "zh": "已为 %d 个标本加载比例尺。", "es": "Escala cargada en %d espécimen(es)."}, "cv.add": {"en": "+ Add curve", "zh": "+ 添加曲线", "es": "+ Añadir curva"}, "cv.add.title": {"en": "Adds a new semilandmark curve: click on the landmark where it starts, along the outline, and end on another landmark (N)", "zh": "添加一条新的半标志点曲线：单击起点标志点，沿轮廓单击，并在另一个标志点结束（N）", "es": "Añade una curva de semilandmarks nueva: clic en el landmark donde empieza, a lo largo del borde, y termina en otro landmark (N)"}, "cv.addHint": {"en": "New curve: click on the landmark where it starts, then along the outline, and end on another landmark (Esc cancels).", "zh": "新曲线：单击起点标志点，再沿轮廓单击，并在另一个标志点结束（Esc 取消）。", "es": "Curva nueva: clic en el landmark donde empieza, luego a lo largo del borde, y termina en otro landmark (Esc cancela)."}, "cv.addNeedLm": {"en": "A semilandmark curve goes from one landmark to another: add at least two landmarks first.", "zh": "半标志点曲线从一个标志点到另一个标志点：请先添加至少两个标志点。", "es": "Una curva de semilandmarks va de un landmark a otro: primero añade al menos dos landmarks."}, "cv.na.title": {"en": "Mark the selected curve as missing (A): all its semilandmarks are exported as NA, as many as the curve has in the other specimens", "zh": "将所选曲线标记为缺失（A）：其所有半标志点都导出为 NA，数量与其他标本中该曲线相同", "es": "Marcar la curva seleccionada como ausente (A): todos sus semilandmarks se exportan como NA, tantos como tenga la curva en los demás especímenes"}, "cv.naDone": {"en": "Curve %s marked NA: its %d semilandmarks will be exported as missing.", "zh": "曲线 %s 已标记为 NA：其 %d 个半标志点将作为缺失导出。", "es": "Curva %s marcada como NA: sus %d semilandmarks se exportarán como ausentes."}, "sst.cvNa": {"en": "NA curves (missing): %s", "zh": "NA 曲线（缺失）：%s", "es": "Curvas NA (ausentes): %s"}, "tb.cite": {"en": "How to cite", "zh": "如何引用", "es": "Cómo citar"}, "tb.cite.title": {"en": "How to cite Landmark Studio in a paper or thesis", "zh": "如何在论文中引用 Landmark Studio", "es": "Cómo citar Landmark Studio en un artículo o una tesis"}, "cite.title": {"en": "How to cite Landmark Studio", "zh": "如何引用 Landmark Studio", "es": "Cómo citar Landmark Studio"}, "cite.intro": {"en": "If you use Landmark Studio in published work, please cite it (for example in the Methods, next to the software used for the analyses):", "zh": "如果你在发表的研究中使用了 Landmark Studio，请引用它（例如在“方法”部分，与分析所用软件一起）：", "es": "Si usas Landmark Studio en un trabajo publicado, cítalo (por ejemplo en Métodos, junto al software usado en los análisis):"}, "cite.text": {"en": "Reference", "zh": "参考文献", "es": "Referencia"}, "cite.copy": {"en": "Copy", "zh": "复制", "es": "Copiar"}, "cite.copied": {"en": "Copied to the clipboard.", "zh": "已复制到剪贴板。", "es": "Copiado al portapapeles."}, "cite.version": {"en": "Version", "zh": "版本", "es": "Versión"}, "cite.software": {"en": "Computer software", "zh": "计算机软件", "es": "Software"}, "cite.noDoi": {"en": "The DOI (Zenodo) will be added with the first published release.", "zh": "DOI（Zenodo）将在首个正式版本发布后添加。", "es": "El DOI (Zenodo) se añadirá con la primera versión publicada."}, "cite.libs": {"en": "Landmark Studio is free software under the GNU GPL v3 license. It includes UTIF.js and pako (MIT).", "zh": "Landmark Studio 是采用 GNU GPL v3 许可证的自由软件，包含 UTIF.js 和 pako（MIT）。", "es": "Landmark Studio es software libre con licencia GNU GPL v3. Incluye UTIF.js y pako (MIT)."}};

{
	if(imgs==null) imgs = document.getElementsByTagName("img");
	var sufs = ["tif","tiff","dng","cr2","nef"]
	for (var i=0; i<imgs.length; i++)
	{
		var img=imgs[i], src=img.getAttribute("src");  if(src==null) continue;
		var suff=src.split(".").pop().toLowerCase();
		if(sufs.indexOf(suff)==-1) continue;
		var xhr = new XMLHttpRequest();  UTIF._xhrs.push(xhr);  UTIF._imgs.push(img);

	img.setAttribute("src",cnv.toDataURL());
}

function reflectData(x, axis) {
  const pts = [];
  x.lm.forEach((p) => { if (isPt(p)) pts.push(p); });
  x.curves.forEach((c) => { if (c) c.forEach((p) => { if (isPt(p)) pts.push(p); }); });
  x.outlines.forEach((o) => o.forEach((p) => pts.push(p)));
  if (x.scale && x.scale.pts) x.scale.pts.forEach((p) => pts.push(p));
  if (!pts.length) return;
  const vals = pts.map((p) => p[axis]), c = Math.min(...vals) + Math.max(...vals);
  pts.forEach((p) => { p[axis] = c - p[axis]; });
  flash(t(axis === 'x' ? 'fl.reflX' : 'fl.reflY'));
}

function parseScaleCSV(text) {
  const rows = String(text).replace(/^\ufeff/, '').split(/\r?\n/).filter((l) => l.trim());
  if (!rows.length) return [];
  const sep = rows[0].includes('\t') ? '\t' : rows[0].includes(';') ? ';' : ',';
  const unq = (v) => String(v == null ? '' : v).trim().replace(/^"(.*)"$/, '$1').trim();
  const out = [];
  rows.forEach((l) => {
    const c = l.split(sep).map(unq); if (c.length < 2 || !c[0]) return;
    const v = parseFloat(c[1].replace(',', '.'));
    out.push({ name: c[0], v });
  });
  if (out.length && !(out[0].v > 0)) out.shift();
  return out;
}

async function docxParagraphs(buf) {

  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('.docx?');
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true); const dec = new TextDecoder();
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nLen = dv.getUint16(p + 28, true), xLen = dv.getUint16(p + 30, true), cLen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nLen)); p += 46 + nLen + xLen + cLen;
    if (name !== 'word/document.xml') continue;
    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    const raw = u8.slice(start, start + csize); let xb;
    if (method === 0) xb = raw;
    else { const st = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw')); xb = new Uint8Array(await new Response(st).arrayBuffer()); }
    const xml = new DOMParser().parseFromString(dec.decode(xb), 'application/xml'); const out = [];
    for (const para of xml.getElementsByTagName('w:p')) { let s0 = ''; for (const tt of para.getElementsByTagName('w:t')) s0 += tt.textContent; out.push(s0); }
    return out;
  }
  throw new Error('.docx?');
}

  prefs.autoAdv = body.querySelector('#setAuto').checked; savePrefs();
  if (P) {
    const nf = body.querySelector('input[name=fmt]:checked').value, nfl = body.querySelector('#setFlip').checked;
    if (nf !== P.settings.tpsFormat || nfl !== (P.settings.flipExport !== false)) { P.settings.tpsFormat = nf; P.settings.flipExport = nfl; changed(); }
  }
  render();
}

const CITE = {
  authors: [{ family: 'Sanisidro', given: 'Oscar' }],
  title: 'Landmark Studio',
  version: '1.0.0',
  year: 2026,
  doi: '10.5281/zenodo.23965715',
  url: 'https://github.com/oscarsanisidro/landmark-studio'
};
function citeText() {
  const au = CITE.authors.map((a) => a.family + ', ' + a.given.split(/\s+/).map((w) => w[0] + '.').join(' ')).join(', ');
  const where = CITE.doi ? 'Zenodo. https://doi.org/' + CITE.doi : CITE.url;
  return au + ' (' + CITE.year + '). ' + CITE.title + ' (' + t('cite.version') + ' ' + CITE.version + ') [' + t('cite.software') + ']. ' + where;
}
function citeBib() {
  const key = CITE.authors[0].family.toLowerCase() + CITE.year + 'landmarkstudio';
  return '@software{' + key + ',\n' +
    '  author    = {' + CITE.authors.map((a) => a.family + ', ' + a.given).join(' and ') + '},\n' +
    '  title     = {' + CITE.title + '},\n' +
    '  year      = {' + CITE.year + '},\n' +
    '  version   = {' + CITE.version + '},\n' +
    (CITE.doi ? '  publisher = {Zenodo},\n  doi       = {' + CITE.doi + '},\n' : '') +
    '  url       = {' + (CITE.doi ? 'https://doi.org/' + CITE.doi : CITE.url) + '}\n}';
}
function cmdCite() {
  const body = document.createElement('div');
  body.className = 'cite';
  body.innerHTML = '<p>' + esc(t('cite.intro')) + '</p>' +
    '<div class="cite-h">' + esc(t('cite.text')) + ' <button class="mbtn cite-cp" data-c="txt">' + esc(t('cite.copy')) + '</button></div>' +
    '<pre class="cite-box" data-c="txt"></pre>' +
    '<div class="cite-h">BibTeX <button class="mbtn cite-cp" data-c="bib">' + esc(t('cite.copy')) + '</button></div>' +
    '<pre class="cite-box" data-c="bib"></pre>' +
    (CITE.doi ? '' : '<p class="small-muted">' + esc(t('cite.noDoi')) + '</p>') +
    '<p class="small-muted">' + esc(t('cite.libs')) + '</p>';
  const val = { txt: citeText(), bib: citeBib() };
  body.querySelectorAll('pre[data-c]').forEach((pre) => { pre.textContent = val[pre.dataset.c]; });
  body.querySelectorAll('.cite-cp').forEach((b) => b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(val[b.dataset.c]); toast(t('cite.copied')); }
    catch (e) { const pre = body.querySelector('pre[data-c="' + b.dataset.c + '"]'); const r = document.createRange(); r.selectNodeContents(pre); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(r); }
  }));
  modal({ title: t('cite.title'), body, buttons: [{ label: t('btn.close'), value: null, kind: 'primary' }] });
}
on('btnCite', cmdCite);
function cmdHelp() { modal({ title: t('help.title'), body: '<div class="help">' + t('help.htmlWeb') + '<div class="hcredit"><img src="' + LOGO_FULL + '" alt=""><span>' + esc(t('creditLong')) + '</span></div></div>', wide: true }); }

async function renderWelcome() {
  const w = $('welcome');
  let h = '<img class="wlogo" src="' + LOGO_FULL + '" alt="Landmark Studio"><p class="wcredit">' + esc(t('credit')) + '</p><p>' + t('welcome.p1web') + '</p><p>' + esc(t('welcome.p2web')) + '</p>' +
    '<div class="wbtns"><button class="mbtn primary" data-w="new">' + esc(t('tb.new')) + '</button><button class="mbtn" data-w="open">' + esc(t('tb.open')) + '</button>' +
    '<button class="mbtn" data-w="tmpl">' + esc(t('tb.template')) + '</button><button class="mbtn" data-w="help">' + esc(t('welcome.howto')) + '</button></div>';
  if (!HAS_FS) h += '<div class="issue aviso compat"><b>' + esc(t('compat.title')) + '</b>' + esc(t('compat.body')) + '</div>';
  const rec = await recentList();
  if (rec.length) {
    h += '<h3>' + esc(t('welcome.recent')) + '</h3><div class="recent">' +
      rec.map((r, i) => '<button class="rec" data-r="' + i + '"><b>' + esc(stripExt(r.file)) + '</b><span>📁 ' + esc(r.folder) + ' · ' + new Date(r.date).toLocaleDateString() + '</span></button>').join('') + '</div>';
  }
  const bk = await kvGet('backup');
  if (bk && bk.dirty && bk.proj) h += '<div class="issue info"><b>' + esc(t('welcome.recoverT')) + '</b>' + esc(t('welcome.recoverP', bk.proj.name, new Date(bk.date).toLocaleString())) +
    ' <button class="mbtn" data-w="recover">' + esc(t('welcome.recover')) + '</button></div>';
  w.innerHTML = h;
  w.querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => ({ new: cmdNew, open: cmdOpen, tmpl: templateWindow, help: cmdHelp, recover: recoverBackup })[b.dataset.w]()));
  w.querySelectorAll('[data-r]').forEach((b) => b.addEventListener('click', () => openRecent(rec[+b.dataset.r])));
}
async function openRecent(r) {
  if (!(await confirmDiscard())) return;
  toast(t('rec.pick', r.folder));
  if (!(await pickFolder())) return;
  if (hasFile(r.file)) openFile(store.files.get(r.file.toLowerCase()).path); else openFromFolder();
}
async function recoverBackup() {
  const bk = await kvGet('backup'); if (!bk) return;
  modal({ title: t('welcome.recoverT'), body: '<p>' + esc(t('rec.how', bk.folder || '?')) + '</p>', buttons: [{ label: t('btn.cancel'), value: null }, { label: t('tb.open'), value: 'ok', kind: 'primary' }] }).then(async (v) => {
    if (v !== 'ok' || !(await pickFolder())) return;
    loadProject(bk.proj, '');
    dirty = true; changed();
  });
}

on('btnNew', cmdNew);
on('btnOpen', cmdOpen);
on('btnImportTps', cmdImportTps);
on('btnSave', () => { if (P) saveNow(); });
on('btnSaveAs', cmdSaveAs);
on('btnExportTps', cmdExportTps);
on('btnReview', cmdReview);
on('btnSettings', cmdSettings);
on('btnHelp', cmdHelp);

(function start() {
  let l = null; try { l = localStorage.getItem('lm-lang'); } catch (e) { }
  if (!l) { const n = (navigator.language || 'en').toLowerCase(); l = n.startsWith('zh') ? 'zh' : n.startsWith('es') ? 'es' : 'en'; }
  setLang(l);
  setTimeout(resizeCanvas, 30);
})();

})();
</script>
